name: THESMIO • Open Data sync and deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/catalog.json'
  workflow_dispatch:
  schedule:
    # UTC: four times daily (local Greece time shifts with daylight saving).
    - cron: '15 3,9,15,21 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: thesmio-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate data adapters
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Collect open datasets
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_data.py
      - name: Report upstream source results
        if: always()
        shell: bash
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          f=Path('public/data/catalog.json')
          d=json.loads(f.read_text(encoding='utf-8')) if f.exists() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as report:
              report.write('## THESMIO data ingestion\n\n')
              report.write('| Collection | Status | Entries | Detail |\n| --- | --- | ---: | --- |\n')
              for key,src in (d.get('sources') or {}).items():
                  msg=str(src.get('error','') or src.get('coverage','')).replace('|','/').replace('\n',' ')[:180]
                  report.write(f"| {key} ({src.get('name','')}) | {src.get('status','unknown')} | {src.get('count',0)} | {msg} |\n")
          PYREPORT
      - name: Persist latest verified snapshot
        continue-on-error: true
        shell: bash
        run: |
          if ! git diff --quiet -- public/data/catalog.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/catalog.json
            git commit -m 'data: refresh public snapshots [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run check
      - name: Build GitHub Pages
        env:
          THESMIO_CUSTOM_DOMAIN: 'false'
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
